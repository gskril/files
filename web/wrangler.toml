name = "files"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cache /cdn responses at the edge per their Cache-Control headers (immutable
# content-addressed files). Responses without Cache-Control are still cached
# heuristically, so API routes set `Cache-Control: private, no-store` in
# middleware to keep cached responses from bypassing the auth check.
[cache]
enabled = true

# Bind an R2 Bucket. Use R2 to store arbitrarily large blobs of data, such as files.
# Docs: https://developers.cloudflare.com/workers/runtime-apis/bindings/r2/
[[r2_buckets]]
binding = "R2"
bucket_name = "files"

# The necessary secrets are:
# - ADMIN_SECRET
# Run `echo <VALUE> | npx wrangler secret put <NAME>` for each of these
